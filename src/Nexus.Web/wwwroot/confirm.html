<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Confirm your address — Nexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..700,0..100,0..1&family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<header id="site-header"></header>
<main class="wrap"><div id="main"></div></main>
<footer id="site-footer"></footer>
<script src="assets/js/api.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/site.js"></script>
<script>
/* Where a confirmation link lands.
 *
 * The user id and the token are in the fragment, which a browser never puts in a request
 * line, so a mailed link leaves no credential in anybody's access log — the same choice
 * download.html makes, for the same reason.
 *
 * The POST happens once per page load, not once per paint: switching language must not
 * spend the token a second time.
 */
let confirmState = { done: false, result: null };

function hashArgs() {
  const raw = (location.hash || '').replace(/^#/, '');
  const p = new URLSearchParams(raw);
  return { userId: p.get('u') || '', token: p.get('t') || '' };
}

function render() {
  const m = document.getElementById('main');

  if (!confirmState.done) {
    m.innerHTML = `<div class="empty"><h3>${t('cf_title')}</h3><p>${t('cf_working')}</p></div>`;
    return;
  }

  const r = confirmState.result;

  if (!r || !r.ok) {
    m.innerHTML = `<div class="empty">
      <h3>${t('cf_bad_t')}</h3><p>${t('cf_bad_d')}</p>
      <a class="btn" href="account.html">${t('ac_tab_signin')}</a></div>`;
    return;
  }

  // The claimed count is the whole point of AC-7 being visible: a buyer who bought as a
  // guest last month should be told the books came with them, not left to go and look.
  const claimed = r.body && r.body.claimedOrders > 0
    ? `<p>${tf('cf_claimed', { n: r.body.claimedOrders })}</p>`
    : '';

  m.innerHTML = `<div class="ok">
    <div class="ok-mark">&#10003;</div>
    <h1>${t('cf_ok_t')}</h1>
    <p class="muted">${t('cf_ok_d')}</p>
    ${claimed}
    <div class="btns">
      <a class="btn" href="account.html">${t('ac_tab_signin')}</a>
      <a class="btn btn-ghost" href="library.html">${t('nav_library')}</a>
    </div></div>`;
}

(async () => {
  const { userId, token } = hashArgs();

  confirmState.result = userId && token
    ? await Account.confirm({ userId, token })
    : { ok: false };
  confirmState.done = true;

  // paint() may not have run yet; render() is safe to call twice and the bootstrap
  // calls it again once the chrome exists.
  if (document.getElementById('site-header').innerHTML) paint();
})();
</script>
</body></html>
