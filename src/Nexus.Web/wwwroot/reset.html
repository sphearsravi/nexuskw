<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Choose a new password — Nexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..700,0..100,0..1&family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<header id="site-header"></header>
<main class="wrap">
  <div class="page-head"><h1 data-i18n="rs_title"></h1></div>
  <div id="main"></div>
</main>
<footer id="site-footer"></footer>
<script src="assets/js/api.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/site.js"></script>
<script>
/* Where a password-reset link lands. The token is in the fragment for the same reason
   as on confirm.html: it never reaches a server log on the way here. */
const reset = { password: '', msg: null, done: false };

function args() {
  const p = new URLSearchParams((location.hash || '').replace(/^#/, ''));
  return { userId: p.get('u') || '', token: p.get('t') || '' };
}

function render() {
  const m = document.getElementById('main');
  const { userId, token } = args();

  if (reset.done) {
    m.innerHTML = `<div class="ok">
      <div class="ok-mark">&#10003;</div>
      <h1>${t('rs_ok_t')}</h1><p class="muted">${t('rs_ok_d')}</p>
      <div class="btns"><a class="btn" href="account.html">${t('ac_tab_signin')}</a></div></div>`;
    return;
  }

  if (!userId || !token) {
    m.innerHTML = `<div class="empty">
      <h3>${t('rs_bad_t')}</h3><p>${t('rs_bad_d')}</p>
      <a class="btn" href="account.html">${t('ac_tab_forgot')}</a></div>`;
    return;
  }

  const msg = reset.msg
    ? `<div class="form-msg bad" role="status"><strong>${esc(reset.msg.title)}</strong><br>${esc(reset.msg.detail)}</div>`
    : '';

  m.innerHTML = `<div class="acct">${msg}
    <form id="rs-form">
      <label class="field"><span>${t('ac_new_password')}</span>
        <input type="password" name="password" value="${esc(reset.password)}" autocomplete="new-password"></label>
      <p class="field-hint">${tf('ac_pw_hint', { n: PASSWORD_MIN })}</p>
      <button class="btn" data-go>${t('rs_btn')}</button>
    </form></div>`;
}

async function submit(button) {
  const f = document.getElementById('rs-form');
  reset.password = f.elements.namedItem('password').value;

  button.disabled = true;
  button.textContent = t('ac_working');

  const { userId, token } = args();
  const r = await Account.reset({ userId, token, password: reset.password });

  if (r.ok) {
    reset.done = true;
    reset.password = '';
  } else {
    // An expired or spent token and a password that is too short are different
    // problems and must not share a sentence: one of them the reader can fix here.
    reset.msg = r.body && r.body.code === 'weak_password'
      ? { title: t('ac_err_t'), detail: t('ac_err_password') }
      : { title: t('rs_bad_t'), detail: t('rs_bad_d') };
    reset.password = '';
  }

  paint();
}

document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if (go) { e.preventDefault(); submit(go); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.closest('#rs-form')) return;
  const go = document.querySelector('[data-go]');
  if (go) { e.preventDefault(); submit(go); }
});
</script>
</body></html>
