<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — Nexus control panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..700,0..100,0..1&family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/site.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
<div class="login-wrap"><div class="login set" id="box"></div></div>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/admin-demo.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/site.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
function render(){
  document.getElementById('box').innerHTML=`
    <a class="brand" href="../index.html" style="margin-bottom:20px;display:flex">
      <span class="brand-mark"></span>
      <span><span class="brand-name">${t('brand')}</span><span class="brand-sub">${t('a_title')}</span></span></a>
    <div class="f"><label>${t('a_user')}</label><input value="admin@nexus.com"></div>
    <div class="f"><label>${t('a_pass')}</label><input type="password" value="admin"></div>
    <a class="btn btn-wide" href="index.html">${t('a_signin')}</a>
    <p class="note" style="text-align:center">${t('a_hint')}</p>
    <p style="text-align:center;margin-top:14px"><button class="lang" data-lang>${isAR()?'English':'العربية'}</button></p>`;
}
</script>
</body></html>
