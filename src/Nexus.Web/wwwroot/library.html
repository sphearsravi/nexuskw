<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>My library — Nexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..700,0..100,0..1&family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<header id="site-header"></header>
<main class="wrap">
  <div class="page-head"><h1 data-i18n="lib_title"></h1><p class="muted" data-i18n="lib_sub"></p></div>
  <div id="main"></div>
</main>
<footer id="site-footer"></footer>
<script src="assets/js/api.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/site.js"></script>
<script>
/* The library, read from the customer's download grants.
 *
 * This page used to read localStorage, which made it a lie: the shelf was empty on a
 * second device, full of somebody else's books on a shared computer, and wrong about the
 * download counter in every case. The counter and the expiry now come from the rows that
 * actually police the download, so what the page says and what the server will do are
 * the same thing.
 *
 * Titles come from the order's own snapshots, not from the catalogue, so a book the
 * operator later unpublishes or renames still appears in the library of the people who
 * bought it, under the name they bought it by.
 */
let shelf = null;
let shelfError = null;
let reissueFailed = false;

async function loadShelf() {
  const r = await Account.library();
  if (r.ok) { shelf = r.body || []; shelfError = null; }
  else { shelf = []; shelfError = r.status; }
}

function stateLabel(item) {
  return { expired: t('lib_st_expired'), exhausted: t('lib_st_exhausted'), revoked: t('lib_st_revoked') }[item.state];
}

function row(item) {
  const b = book(item.bookId);
  const title = isAR() ? item.titleAr : item.titleEn;
  const author = isAR() ? item.authorAr : item.authorEn;
  const dead = item.downloadUrl === null;
  const days = Math.max(0, daysUntil(item.expiresAt));
  const used = item.max > 0 ? (item.used / item.max) * 100 : 0;

  const action = dead
    ? (item.canReIssue
        ? `<button class="btn btn-ghost btn-sm" data-reissue="${item.grantId}">${t('lib_reissue')}</button>`
        : '')
    : `<a class="btn btn-sm" href="${esc(item.downloadUrl)}">${t('lib_dl')}</a>`;

  return `<div class="lib-item ${dead ? 'stale' : ''}">
    ${b ? cover(b) : ''}
    <div class="lib-body">
      ${b ? `<a class="line-title" href="book.html?id=${item.bookId}">${esc(title)}</a>`
          : `<span class="line-title">${esc(title)}</span>`}
      <p class="muted" style="font-size:13.5px">${esc(author)} · ${t('lib_order')} ${esc(item.orderNumber)}</p>
      <div class="meter"><span style="width:${used}%"></span></div>
      <p class="lib-meta">${dead
        ? `<span class="lib-state">${esc(stateLabel(item) || '')}</span>`
        : `${item.left} ${t('lib_left')} · ${t('lib_expires')} ${days} ${t('lib_days')}`}</p>
    </div>
    ${action}
  </div>`;
}

/* Async, like download.html's: paint() does not await it, and the shelf is cached so
   switching language repaints from memory instead of asking the server again. */
async function render() {
  const m = document.getElementById('main');

  if (!Account.signedIn) {
    m.innerHTML = `<div class="empty" style="padding-bottom:90px">
      <h3>${t('lib_signin_t')}</h3><p>${t('lib_signin_d')}</p>
      <a class="btn" href="account.html">${t('lib_signin_cta')}</a></div>`;
    return;
  }

  if (shelf === null) {
    m.innerHTML = `<div class="empty"><p>${t('ac_working')}</p></div>`;
    await loadShelf();
  }

  if (shelfError) {
    m.innerHTML = `<div class="empty"><h3>${t('err_cat_t')}</h3><p>${t('err_cat_d')}</p>
      <button class="btn btn-ghost" onclick="location.reload()">${t('err_retry')}</button></div>`;
    return;
  }

  if (!shelf.length) {
    m.innerHTML = `<div class="empty" style="padding-bottom:90px"><h3>${t('lib_empty_t')}</h3>
      <p>${t('lib_empty_d')}</p><a class="btn" href="shop.html">${t('cart_empty_cta')}</a></div>`;
    return;
  }

  const warning = reissueFailed
    ? `<div class="form-msg bad" role="status">${t('lib_reissue_fail')}</div>`
    : '';

  m.innerHTML = warning + '<div class="lib">' + shelf.map(row).join('') + '</div>';
}

document.addEventListener('click', async e => {
  const r = e.target.closest('[data-reissue]');
  if (!r) return;

  r.disabled = true;
  r.textContent = t('ac_working');

  // AC-4: the customer fixes the commonest complaint without a support request. The
  // whole shelf is reloaded rather than the one row patched, because the server has
  // just decided which grant is the live one.
  const response = await Account.reissue(r.dataset.reissue);
  reissueFailed = !response.ok;

  await loadShelf();
  paint();
});
</script>
</body></html>
