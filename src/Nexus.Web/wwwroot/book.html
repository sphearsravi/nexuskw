<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book — Nexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..700,0..100,0..1&family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<header id="site-header"></header>
<main class="wrap" id="main"></main>
<footer id="site-footer"></footer>
<script src="assets/js/api.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/site.js"></script>
<script>
/* CAT-20: an unknown, unpublished or malformed id shows an honest not-found
   panel. The demo fell back to BOOKS[0], so ?id=9999 silently displayed a
   different book - a shareable URL that lied about what it pointed to. */
async function render(){
  const raw = new URLSearchParams(location.search).get('id');
  const id = /^d+$/.test(raw || '') ? +raw : null;
  const main = document.getElementById('main');

  let b = null;
  if (id !== null) {
    try { b = await Catalogue.book(id); }
    catch (e) { catalogueDown(); return; }
  }

  if (!b) {
    main.innerHTML = `<div class="empty"><h3>${t('nf_t')}</h3><p>${t('nf_d')}</p>
      <a class="btn btn-ghost" href="shop.html">${t('nf_cta')}</a></div>`;
    return;
  }

  const o = L(b), c = cat(b.cat), inCart = state.cart.includes(b.id);
  const more = await Catalogue.related(b.id);
  const langLabel = b.languages === 'en' ? t('lang_v_en')
                  : b.languages === 'ar' ? t('lang_v_ar')
                  : t('lang_v_both');

  main.innerHTML = `
  <div class="detail">
    <div>${cover(b)}
      <div class="detail-buy">
        <span class="price" style="font-size:26px">${price(b.price)}</span>
        <button class="btn btn-wide ${inCart?'is-in':''}" data-add="${b.id}">${inCart?t('added'):t('add')}</button>
        <a class="btn btn-ghost btn-wide" href="checkout.html?buy=${b.id}">${t('buy_now')}</a>
      </div>
    </div>
    <div>
      <span class="tag" style="--c:${c ? c.hue : 'var(--ink)'}">${c ? esc(L(c)) : ''}</span>
      <h1>${esc(o.t)}</h1>
      <p class="by">${esc(o.a)}</p>
      <p class="lede">${esc(o.d)}</p>
      <dl class="facts">
        <div class="fact"><dt>${t('f_pages')}</dt><dd>${b.pages}</dd></div>
        <div class="fact"><dt>${t('published')}</dt><dd>${b.year}</dd></div>
        <div class="fact"><dt>${t('lang_l')}</dt><dd>${langLabel}</dd></div>
        ${b.isbn ? `<div class="fact"><dt>ISBN</dt><dd>${esc(b.isbn)}</dd></div>` : ''}
      </dl>
      <h2>${t('detail_inside')}</h2>
      <ul class="toc">
        <li><span>1.</span>${t('toc1')}</li><li><span>2.</span>${t('toc2')}</li>
        <li><span>3.</span>${t('toc3')}</li><li><span>4.</span>${t('toc4')}</li>
      </ul>
    </div>
  </div>
  ${more.length ? `<section class="sec" style="border-top:1px solid var(--rule);border-bottom:0">
    <div class="sec-head"><h2>${t('detail_more')}</h2></div>
    <div class="grid">${more.map(bookCard).join('')}</div>
  </section>` : ''}`;
}
</script>
</body></html>
