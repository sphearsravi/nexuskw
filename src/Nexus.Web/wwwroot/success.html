<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Order received — Nexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..700,0..100,0..1&family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<header id="site-header"></header>
<main class="wrap"><div id="main"></div></main>
<footer id="site-footer"></footer>
<script src="assets/js/api.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/site.js"></script>
<script>
/* No query string.
 *
 * The order reference used to travel in the address bar, which meant it was handed to
 * every third-party asset the page loads through the Referer header, and ended up in
 * browser history and in any shared link. It now lives in an HttpOnly cookie that the
 * server sets at checkout, and this page asks /api/checkout/result for it.
 *
 * Removing the thing that leaks beats mitigating the leak.
 */
async function render() {
  const m = document.getElementById('main');

  let order;
  try {
    const r = await fetch('/api/checkout/result', { headers: { accept: 'application/json' } });
    if (r.status === 404) { location.replace('index.html'); return; }
    if (!r.ok) throw new Error('unavailable');
    order = await r.json();
  } catch (e) {
    catalogueDown();
    return;
  }

  const lines = order.items.map(i => isAR()
    ? { t: i.titleAr, a: i.authorAr, p: i.priceKwd }
    : { t: i.titleEn, a: i.authorEn, p: i.priceKwd });

  // Payment is not switched on yet. The page says exactly that rather than showing a
  // download button that cannot work.
  const held = !order.paymentEnabled;

  m.innerHTML = `<div class="ok">
    <div class="ok-mark">${held ? '&#8987;' : '&#10003;'}</div>
    <h1>${held ? t('co_reserved') : t('ok_title')}</h1>
    <p>${t('ok_body')} <strong>${esc(order.buyerEmail)}</strong></p>

    ${held ? `<div class="empty" style="margin:24px auto;max-width:34rem">
        <h3>${t('co_held_t')}</h3><p>${t('co_held_d')}</p></div>` : `
      <div class="btns">
        <a class="btn" href="library.html">${t('ok_dl')}</a>
        <a class="btn btn-ghost" href="library.html">${t('ok_lib')}</a>
      </div>`}

    <p class="ref">${t('ok_ref')} ${esc(order.orderNumber)} · ${tf('ok_expiry', Delivery.limits())}</p>

    <div class="panel" style="max-width:34rem;margin:28px auto 0;text-align:start">
      ${lines.map(l => `<div class="row-t"><span>${esc(l.t)}</span><span>${price(l.p)}</span></div>`).join('')}
      <div class="row-t grand"><span>${t('total')}</span><span>${price(order.totalKwd)}</span></div>
    </div>
  </div>`;
}
</script>
</body></html>
