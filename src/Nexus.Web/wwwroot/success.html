<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payment received — Nexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..700,0..100,0..1&family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<header id="site-header"></header>
<main class="wrap"><div id="main"></div></main>
<footer id="site-footer"></footer>
<script src="assets/js/api.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/site.js"></script>
<script>
function render(){
  const p=new URLSearchParams(location.search), ref=p.get('o')||'KW-10429', em=p.get('e')||'you@email.com';
  const mine=state.lib.filter(x=>x.order===ref);
  document.getElementById('main').innerHTML=`<div class="ok">
    <div class="ok-mark">&#10003;</div>
    <h1>${t('ok_title')}</h1>
    <p>${t('ok_body')} <strong>${esc(em)}</strong></p>
    <div class="btns">
      <a class="btn" href="library.html">${t('ok_dl')}</a>
      <a class="btn btn-ghost" href="library.html">${t('ok_lib')}</a>
    </div>
    <p class="ref">${t('ok_ref')} ${esc(ref)} · ${t('ok_expiry')}</p>
    <div class="grid" style="margin-top:40px;grid-template-columns:repeat(${Math.min(mine.length||1,4)},1fr)">
      ${mine.map(x=>`<a href="book.html?id=${x.id}">${cover(book(x.id))}</a>`).join('')}
    </div></div>`;
}
</script>
</body></html>
