<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Checkout — Nexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..700,0..100,0..1&family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<header id="site-header"></header>
<main class="wrap">
  <div class="page-head"><h1 data-i18n="co_title"></h1></div>
  <div id="main"></div>
</main>
<footer id="site-footer"></footer>
<script src="assets/js/api.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/site.js"></script>
<script>
/* There is no card form here, and there never will be.
 *
 * Card details are entered on the gateway's own hosted page, which is what keeps this
 * application out of PCI scope entirely. The demo's fake card fields were deleted
 * rather than wired up.
 *
 * The order is created by POST /api/checkout, the single public way to make one, and
 * the total is recomputed there from the catalogue. What this page sends is a claim
 * about the price the buyer was shown, not an instruction about what to charge.
 */
const buy = new URLSearchParams(location.search).get('buy');
if (buy && !state.cart.includes(+buy)) state.cart = [...state.cart, +buy];

/* One key per cart, kept for the life of the cart. A double submission on a slow
   connection must not create two orders, and a genuinely new cart must not reuse
   the old key. */
function idempotencyKey() {
  const fingerprint = state.cart.slice().sort((a, b) => a - b).join(',');
  let saved;
  try { saved = JSON.parse(sessionStorage.getItem('checkout-key') || 'null'); } catch (e) { saved = null; }
  if (saved && saved.cart === fingerprint) return saved.key;
  const key = (crypto.randomUUID && crypto.randomUUID()) ||
    (Date.now() + '-' + Math.random().toString(16).slice(2));
  try { sessionStorage.setItem('checkout-key', JSON.stringify({ cart: fingerprint, key })); } catch (e) { /* ignore */ }
  return key;
}

function clearCheckoutKey() { try { sessionStorage.removeItem('checkout-key'); } catch (e) { /* ignore */ } }

function render() {
  const ids = state.cart, m = document.getElementById('main');
  if (!ids.length) { location.replace('cart.html'); return; }

  const books = ids.map(book).filter(Boolean);
  const sub = books.reduce((s, b) => s + b.price, 0);

  m.innerHTML = `<div class="two">
    <form class="form" id="pay" autocomplete="on" novalidate>
      <fieldset class="fs"><legend>${t('co_contact')}</legend>
        <div class="form">
          <div><label for="nm">${t('co_name')}</label>
            <input id="nm" name="name" autocomplete="name" required maxlength="128"></div>
          <div><label for="em">${t('co_email')}</label>
            <input id="em" name="email" type="email" autocomplete="email" required maxlength="256">
            <p class="help">${t('co_email_help')}</p></div>
        </div>
      </fieldset>
      <div id="co-problem"></div>
    </form>
    <aside class="panel">
      <h3>${t('co_summary')}</h3>
      ${books.map(b => `<div class="row-t"><span>${esc(L(b).t)}</span><span>${price(b.price)}</span></div>`).join('')}
      <div class="row-t grand"><span>${t('total')}</span><span>${price(sub)}</span></div>
      <button class="btn btn-wide" style="margin-top:16px" id="go" type="button">${t('co_pay_btn')} ${price(sub)}</button>
    </aside></div>`;

  document.getElementById('go').onclick = submit;
}

function problem(title, detail, action) {
  const box = document.getElementById('co-problem');
  if (!box) return;
  box.innerHTML = `<div class="empty" style="margin-top:20px">
    <h3>${esc(title)}</h3><p>${esc(detail)}</p>
    ${action ? `<button class="btn btn-ghost" id="co-action" type="button">${esc(action.label)}</button>` : ''}</div>`;
  if (action) document.getElementById('co-action').onclick = action.run;
}

async function submit() {
  const name = document.getElementById('nm').value.trim();
  const email = document.getElementById('em').value.trim();
  const button = document.getElementById('go');

  if (!name || !email || !email.includes('@')) {
    problem(t('co_err_t'), t('co_email_help'));
    return;
  }

  button.disabled = true;
  button.textContent = t('co_placing');

  /* Fils as an integer, not the decimal: JavaScript numbers are floats, and a total
     that drifts by a fils would be refused as a changed price on an order that never
     changed. */
  const totalFils = state.cart
    .map(book).filter(Boolean)
    .reduce((n, b) => n + Math.round(b.price * 1000), 0);

  let response, body;
  try {
    response = await fetch('/api/checkout', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'Idempotency-Key': idempotencyKey() },
      body: JSON.stringify({
        bookIds: state.cart, name, email, language: state.lang, clientTotalFils: totalFils
      })
    });
    body = await response.json().catch(() => null);
  } catch (e) {
    button.disabled = false;
    button.textContent = t('co_pay_btn');
    problem(t('co_err_t'), t('err_cat_d'), { label: t('co_retry'), run: submit });
    return;
  }

  if (response.ok) {
    clearCheckoutKey();
    state.cart = [];
    location.href = 'success.html';
    return;
  }

  button.disabled = false;
  button.textContent = t('co_pay_btn');

  // The catalogue price moved while the cart sat open. The buyer is told, and sees
  // the new price, rather than being charged an amount they never agreed to.
  if (response.status === 409) {
    problem(t('co_stale_t'), (body && body.message) || '', {
      label: t('co_stale_cta'),
      run: () => location.href = 'cart.html'
    });
    return;
  }

  problem(t('co_err_t'), (body && body.message) || t('err_cat_d'));
}
</script>
</body></html>
