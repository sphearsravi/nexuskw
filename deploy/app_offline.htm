<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexus — back shortly</title>
<style>
  :root { --ink:#13202b; --muted:#5b6b78; --bg:#f6f3ee; --line:#e2dcd2; --acc:#0B5D4A; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#eef2f5; --muted:#9aa8b3; --bg:#111719; --line:#2a3337; --acc:#4ea98f; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
         background:var(--bg); color:var(--ink);
         font:16px/1.6 Inter,system-ui,-apple-system,"Segoe UI",sans-serif; }
  .card { max-width:34rem; text-align:center; border:1px solid var(--line);
          border-radius:14px; padding:40px 28px; background:color-mix(in srgb,var(--bg) 70%,#fff); }
  .mark { width:34px; height:34px; border-radius:8px; background:var(--acc); margin:0 auto 20px; }
  h1 { font-size:1.5rem; margin:0 0 10px; letter-spacing:-.01em; }
  p { margin:0 0 6px; color:var(--muted); }
  .ar { margin-top:22px; padding-top:18px; border-top:1px solid var(--line); direction:rtl; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark"></div>
    <h1>We will be back in a few minutes</h1>
    <p>Nexus is being updated. Your purchases and download links are unaffected.</p>
    <div class="ar">
      <h1>سنعود خلال دقائق</h1>
      <p>يجري تحديث نكسس. مشترياتك وروابط التحميل الخاصة بك لم تتأثر.</p>
    </div>
  </div>
</body>
</html>
